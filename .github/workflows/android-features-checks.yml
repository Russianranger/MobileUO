name: Android import and controller checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check import recovery and controller state
        run: dotnet run --project tests/MobileUO.CoreChecks/MobileUO.CoreChecks.csproj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android folder picker
        shell: bash
        run: |
          android_jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          test -n "$android_jar"
          mkdir -p "$RUNNER_TEMP/mobileuo-java"
          javac --release 8 -cp "$android_jar" -d "$RUNNER_TEMP/mobileuo-java" Assets/Plugins/Android/ClientFolderPicker.java
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  unity-availability:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.credentials.outputs.available }}
    steps:
      - id: credentials
        name: Check whether Unity build credentials are configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Unity APK build skipped: UNITY_LICENSE is not configured for this repository. Unity account credentials may also be required by the license.' >> "$GITHUB_STEP_SUMMARY"
          fi

  apk:
    needs: [checks, unity-availability]
    if: needs.unity-availability.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jlumbroso/free-disk-space@v1.3.1
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          customParameters: -BUILD_ENV Development
      - uses: actions/upload-artifact@v4
        with:
          name: MobileUO-folder-import-controller-APK
          path: build/Android/*.apk
          if-no-files-found: error
